[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnr-scannr"
dynamic = ["version"]
description = "Authorized SMB/network exposure assessment, scoring and reporting (nmap/SMB tool orchestration)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "elithaxxor" }]
keywords = ["security", "smb", "nmap", "vulnerability", "assessment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Environment :: Console",
]
# No required runtime dependencies: the core uses only the standard library.
dependencies = []

[project.optional-dependencies]
smb = ["impacket>=0.12,<0.14"]
plot = ["matplotlib>=3.8,<4"]
all = ["vulnr-scannr[smb,plot]"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pip-audit>=2.7", "bandit>=1.7", "build>=1.2"]

[project.scripts]
vulnr-scannr = "vulnr_scannr.cli:main"

[project.urls]
Homepage = "https://github.com/elithaxxor/VulnR_ScannR"
Issues = "https://github.com/elithaxxor/VulnR_ScannR/issues"

[tool.setuptools.dynamic]
version = { attr = "vulnr_scannr.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C90"]
ignore = ["S101", "S603", "S404", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.ruff.lint.mccabe]
max-complexity = 25
